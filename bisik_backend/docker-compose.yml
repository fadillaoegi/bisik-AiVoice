services:
  postgres:
    image: postgres:18-alpine
    container_name: bisik_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bisik
      POSTGRES_PASSWORD: bisik
      POSTGRES_DB: bisik
    volumes:
      # Volume baru: kredensial dan nama database ikut berganti ke `bisik`,
      # dan role/database di dalam volume lama tetap bernama `saksi` — tidak
      # ada cara memakainya tanpa menyisakan nama lama. Volume lama
      # (`saksi_backend_saksi_pgdata18`) sengaja TIDAK dihapus, jadi data uji
      # lama masih bisa diambil kalau suatu saat dibutuhkan.
      # Mulai image 18, image resmi menyimpan cluster pada subdirektori
      # major-version dan meminta volume dipasang di parent directory ini.
      - bisik_pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bisik -d bisik"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opsional: jalankan backend di dalam Docker juga.
  #   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile full up
  # Untuk dev sehari-hari lebih enak `make dev` (hot path di host).
  api:
    profiles: ["full"]
    build: .
    container_name: bisik_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://bisik:bisik@postgres:5432/bisik?sslmode=disable"
      ASSEMBLYAI_API_KEY: "${ASSEMBLYAI_API_KEY}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"

volumes:
  bisik_pgdata18:
